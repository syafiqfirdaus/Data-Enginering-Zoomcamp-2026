services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - "--smp"
      - "1"
      - "--memory"
      - "1G"
      - "--reserve-memory"
      - "0M"
      - "--overprovisioned"
      - "--check=false"
      - "--kafka-addr"
      - "PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092"
      - "--advertise-kafka-addr"
      - "PLAINTEXT://localhost:29092,OUTSIDE://localhost:9092"
    ports:
      - "9092:9092"
      - "29092:29092"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: options_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d options_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
