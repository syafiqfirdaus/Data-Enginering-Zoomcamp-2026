version: '3.7'
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - "--smp"
      - "1"
      - "--memory"
      - "1G"
      - "--reserve-memory"
      - "0M"
      - --overprovisioned
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:29092,OUTSIDE://34.203.236.183:9092
    ports:
      - "9092:9092"
      - "29092:29092"
